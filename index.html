<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="main.js" defer></script>
    <title>Produtos</title>
</head>

<body class="bg-white flex flex-col items-center justify-center h-screen gap-4">
    
    <h1 class="text-2xl font-bold">
        Lista de produtos
    </h1>

    <input 
        type="text"
        id="produto"
        class="border rounded px-4 py-2"
    >

    <button 
        id="botao"
        class="bg-blue-300 text-black py-2 px-6 rounded border border-black"
    >
        Adicionar
    </button>

    <div id="lista"
        class ="flex flex-col gap"
    </div>

</body>
</html>
